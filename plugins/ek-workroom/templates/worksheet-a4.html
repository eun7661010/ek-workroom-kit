<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학습지 · 단원명</title>
<style>
@page{size:A4;margin:16mm}
*{box-sizing:border-box}
body{margin:0;color:#18212b;background:#fff;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:11pt;line-height:1.7;word-break:keep-all;overflow-wrap:break-word}
h1{font-size:22pt;line-height:1.3;margin:0 0 5mm}
h2{font-size:13pt;margin:0 0 3mm}
.sheet-header{border-bottom:2px solid #263d52;padding-bottom:5mm;margin-bottom:6mm}
.metadata{display:flex;flex-wrap:wrap;gap:2mm 7mm;font-size:10pt}
.name-field{min-width:42mm}
.instructions{padding:3mm 4mm;border:1px solid #a9b3bd;margin-bottom:6mm}
.question{break-inside:avoid;page-break-inside:avoid;margin:0 0 7mm}
.question-heading{display:grid;grid-template-columns:9mm 1fr;gap:2mm;margin-bottom:3mm}
.question-number{font-weight:bold}
.passage,.example-box{border:1px solid #8f9ba7;padding:3mm 4mm;margin:3mm 0;white-space:pre-wrap}
.choices{list-style:none;margin:3mm 0;padding:0}
.choices li{display:grid;grid-template-columns:8mm 1fr;gap:2mm;margin:1.5mm 0;break-inside:avoid}
.response-lines{min-height:26mm;border-bottom:1px solid #a9b3bd;background:repeating-linear-gradient(to bottom,transparent 0,transparent 8mm,#d6dce2 8mm,#d6dce2 8.2mm)}
table{width:100%;border-collapse:collapse;margin:3mm 0;font-size:10pt}
th,td{border:1px solid #a9b3bd;padding:2mm;text-align:left;vertical-align:top}
thead{display:table-header-group}tr{break-inside:avoid}
img{display:block;max-width:100%;height:auto;margin:3mm 0}
.page-break{break-before:page}
.sheet-footer{border-top:1px solid #a9b3bd;padding-top:2mm;font-size:9pt}
/* 정답·해설은 answer-a4.html의 별도 파일에만 작성한다. 학생용 HTML에는 넣지 않는다. */
.answer-only{display:none}
</style>
</head>
<body>
<!-- 텍스트와 기존 블록만 교체·반복한다. 이미지·로고는 같은 폴더 또는 하위 폴더 상대 경로만 사용한다. -->
<header class="sheet-header">
  <h1>일차방정식 연습</h1>
  <div class="metadata"><span>학원명: 가상 배움학원</span><span>과목: 수학</span><span>단원: 일차방정식</span><span class="name-field">이름: ______________</span></div>
</header>
<main>
  <section class="instructions" aria-label="학습 안내">풀이 과정과 답을 함께 쓰세요. 주어진 조건을 확인하세요.</section>
  <section class="question" aria-labelledby="q1">
    <div class="question-heading"><span class="question-number">1.</span><h2 id="q1">2x + 3 = 7의 해를 구하세요.</h2></div>
    <div class="example-box">보기: 양변에 같은 수를 더하거나 빼도 등식은 성립합니다.</div>
    <ul class="choices" aria-label="선택지"><li><span>①</span><span>1</span></li><li><span>②</span><span>2</span></li><li><span>③</span><span>3</span></li></ul>
    <div class="response-lines" aria-label="풀이와 답을 쓰는 칸"></div>
  </section>
</main>
<footer class="sheet-footer">학생용 · 가상 자료 · 원장 검수 전 초안</footer>
</body>
</html>
