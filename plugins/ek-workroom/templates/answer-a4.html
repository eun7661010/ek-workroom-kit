<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정답·해설 · 단원명</title>
<style>
@page{size:A4;margin:16mm}
*{box-sizing:border-box}
body{margin:0;color:#18212b;background:#fff;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:11pt;line-height:1.7;word-break:keep-all;overflow-wrap:break-word}
h1{font-size:22pt;line-height:1.3;margin:0 0 5mm}
h2{font-size:14pt;margin:4mm 0 3mm}
h3{font-size:12pt;margin:0 0 2mm}
.sheet-header{border-bottom:2px solid #263d52;padding-bottom:5mm;margin-bottom:6mm}
.metadata{display:flex;flex-wrap:wrap;gap:2mm 7mm;font-size:10pt}
.answer-only{display:block}
.answer-item{break-inside:avoid;page-break-inside:avoid;margin-bottom:7mm;padding:4mm;border:1px solid #a9b3bd}
.label{font-weight:bold;margin-right:2mm}
p{margin:2mm 0}
table{width:100%;border-collapse:collapse;margin:3mm 0;font-size:10pt}
th,td{border:1px solid #a9b3bd;padding:2mm;text-align:left;vertical-align:top}
thead{display:table-header-group}tr{break-inside:avoid}
img{display:block;max-width:100%;height:auto;margin:3mm 0}
.page-break{break-before:page}
.sheet-footer{border-top:1px solid #a9b3bd;padding-top:2mm;font-size:9pt}
/* 수식 블록: 분수는 분자/분모, 근호는 root-body 전체 범위를 원본과 대조한다. */
.formula{display:inline-flex;align-items:center;gap:.15em;vertical-align:middle;white-space:nowrap;line-height:1.2;break-inside:avoid}
.fraction{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle}
.numerator{border-bottom:1px solid currentColor;padding:0 .25em .12em}
.denominator{padding:.12em .25em 0}
.radical{display:inline-flex;align-items:flex-end}
.root-sign{font-size:1.2em;line-height:1;margin-right:-.08em;transform:translateY(.04em)}
.root-body{border-top:1px solid currentColor;padding:.1em .15em 0;line-height:1.1}
.formula sup,.formula sub{font-size:.7em;line-height:0}
</style>
</head>
<body>
<!-- 수식용 기존 블록: template 안의 span을 필요한 위치에 복사한다. 기호·범위를 원본과 대조한다. 외부 라이브러리·URL 금지. -->
<template id="formula-block">
<span class="formula" role="math" aria-label="분수, 첨자, 근호 표현 예">
  <span class="fraction"><span class="numerator">a + b</span><span class="denominator">c</span></span>
  <span>x<sub>1</sub><sup>2</sup> + </span>
  <span class="radical"><span class="root-sign">√</span><span class="root-body">a + b</span></span>
</span>
</template>
<!-- 한 쪽 초과 문항·해설은 승인된 문단 경계에서 수동 분할한다. 번호와 ‘계속’을 반복하고 .page-break를 사용한다. 표는 행 경계로 나누고 머리글을 반복한다. 그림·답안 칸도 쪽 경계를 확인하고, 한 쪽보다 큰 그림은 승인된 크기나 분할로 맞춘다. -->
<!-- 학생용과 별도 파일로 저장한다. 이미지·로고는 같은 폴더 또는 하위 폴더 상대 경로만 사용한다. -->
<header class="sheet-header"><h1>일차방정식 정답·해설</h1><div class="metadata"><span>학원명: 가상 배움학원</span><span>과목: 수학</span><span>단원: 일차방정식</span><span>정답용</span></div></header>
<main class="answer-only">
  <section aria-labelledby="answer-key"><h2 id="answer-key">정답표</h2><table><thead><tr><th scope="col">문항</th><th scope="col">정답</th></tr></thead><tbody><tr><td>1</td><td>② (x = 2)</td></tr></tbody></table></section>
  <section aria-labelledby="explanations"><h2 id="explanations">문항별 해설</h2><article class="answer-item"><h3>1번</h3><p><span class="label">정답</span>② (x = 2)</p><p><span class="label">근거 위치</span>1번의 식 2x + 3 = 7</p><p><span class="label">풀이</span>양변에서 3을 빼면 2x = 4입니다. 양변을 2로 나누면 x = 2입니다.</p><p><span class="label">오답 이유</span>①을 대입하면 좌변은 5, ③을 대입하면 9이므로 주어진 등식을 만족하지 않습니다.</p><p><span class="label">확인 필요</span>해당 과목 교사 검수 대기</p></article></section>
</main>
<footer class="sheet-footer">정답용 · 가상 자료 · 원장 검수 전 초안</footer>
</body>
</html>
